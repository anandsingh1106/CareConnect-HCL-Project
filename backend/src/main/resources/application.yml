# CareConnect backend configuration.
# Secrets are never hard-coded here: they come from environment variables.
# The "dev" profile (default) supplies safe local defaults for the Oracle XE on this machine.

spring:
  application:
    name: careconnect
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  jpa:
    # OracleLegacyDialect supports Oracle 8i-11g (ROWNUM paging, sequences) and still works on newer releases.
    database-platform: org.hibernate.community.dialect.OracleLegacyDialect
    open-in-view: false
    hibernate:
      ddl-auto: none          # Liquibase owns the schema
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8090
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

careconnect:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  demo-data:
    enabled: false

logging:
  level:
    root: INFO
    com.careconnect: INFO
