# Production profile: every connection setting and secret must come from the environment
# (DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, UPLOAD_DIR).
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

careconnect:
  demo-data:
    enabled: false

logging:
  level:
    com.careconnect: INFO
