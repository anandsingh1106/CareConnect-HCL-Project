# Automated tests use an in-memory H2 database in PostgreSQL compatibility mode.
spring:
  datasource:
    url: jdbc:h2:mem:careconnect-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

careconnect:
  jwt:
    secret: test-only-careconnect-jwt-secret-0123456789abcdef
  storage:
    upload-dir: ${java.io.tmpdir}/careconnect-test-uploads
  demo-data:
    enabled: false
